name: Publish to npm

on:
    push:
        tags:
            - 'v*'

permissions:
    id-token: write
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout code
                uses: actions/checkout@v6

            -   name: Setup Node.js
                uses: actions/setup-node@v6
                with:
                    node-version: '24'
                    registry-url: 'https://registry.npmjs.org'

            -   name: Install dependencies
                run: npm install

            -   name: Publish to npm
                run: npm run deploy
